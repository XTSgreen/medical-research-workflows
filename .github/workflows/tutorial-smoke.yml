name: Tutorial data check

on:
  push:
    paths:
      - 'examples/workflow-starter/**'
      - '.github/workflows/tutorial-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/workflow-starter
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check known values and invalid inputs
        run: python -m unittest discover -s tests -v
      - name: Summarize fictional data
        run: python audit_csv.py --data data/demo.csv --output output/summary.json
      - name: Save the report
        uses: actions/upload-artifact@v6
        with:
          name: tutorial-summary
          path: examples/workflow-starter/output/summary.json
          if-no-files-found: error
          retention-days: 7
